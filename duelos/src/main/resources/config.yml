# NormsafioCasinoDuelos - duelos 1 contra 1 con Monedas Dopamina
# Cada jugador apuesta X monedas; el ganador se lleva el bote (2X). Empate = se devuelven.

# Apuesta maxima por jugador (1 o 2 monedas)
max-bet: 2

# Segundos que tiene el rival para aceptar el reto
challenge-expire: 30

# Segundos por turno/ronda. Si pasan, se juega automatico (plantarse / tirar / elegir al azar)
turn-timeout: 60

# Avisar a todo el servidor cuando alguien gana un duelo
announce-wins: false

# Juegos activos
games:
  blackjack: true
  dados: true
  ppt: true
