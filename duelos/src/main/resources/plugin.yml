name: NormsafioCasinoDuelos
version: '1.0.0'
main: es.normsafio.duelos.DuelosPlugin
api-version: '1.21'
depend: [Normsafio, NormsafioCasino]
description: Duelos 1 contra 1 entre jugadores reales (Blackjack, Dados, Piedra Papel Tijera) apostando Monedas Dopamina
commands:
  duelo:
    description: Retar a otro jugador a un duelo de apuestas
    usage: /duelo <jugador> <blackjack|dados|ppt> [1|2]  |  /duelo <aceptar|rechazar|cancelar|reabrir|juegos>
    aliases: [duelos, retar]
